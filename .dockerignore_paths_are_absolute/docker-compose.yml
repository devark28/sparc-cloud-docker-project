version: "3.8"

services:
  db:
    image: mysql:8.0
    container_name: todo-mysql-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_secret_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_secret_pass"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: release
    container_name: todo-backend-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      MYSQL_HOST: db
      NODE_ENV: development
    depends_on:
      db:
        condition: service_healthy
    develop:
      watch:
        # Action A: If any backend file changes, sync it inside the container
        - action: sync
          path: ./backend
          target: /app
          ignore:
            - backend/node_modules/

        # Action B: If any frontend file changes, trigger an automatic re-compilation
        # of the client assets directly inside the build cache!
        - action: rebuild
          path: ./client
          ignore:
            - client/node_modules/

volumes:
  mysql_data:

